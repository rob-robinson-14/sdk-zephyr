description: |
  nRF SoC battery voltage measurement via the SAADC (Zephyr ADC driver).
  Reports SENSOR_CHAN_VOLTAGE in volts (sensor_value).

compatible: "nordic,nrf-vbat"

include: sensor-device.yaml

properties:

  min-threshold-mv:
    type: int
    description: |
      Low-voltage threshold in millivolts for application use.
  pselp:
    type: int
    required: true
    description: |
      SAADC positive pin selection for battery voltage measurement from nrfx_analog_input_t.
  pseln:
    type: int
    description: |
      SAADC positive pin selection for battery voltage measurement from nrfx_analog_input_t.
    
  invert-voltage:
    type: boolean
    description: |
      If true, the voltage value is inverted 
      i.e. for use when positive pin used for ground.
